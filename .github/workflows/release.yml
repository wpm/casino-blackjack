name: Release

# Builds installers for every desktop platform when a version tag (v*) is
# pushed, and attaches them to a GitHub Release for that tag.
#
# Per-platform artifacts (Tauri picks the applicable bundle targets from
# tauri.conf.json on each host):
#   - macos-latest   → .dmg + .app  (Apple Silicon / aarch64 only; the
#                      runner's native architecture — no universal binary)
#   - ubuntu-latest  → .AppImage + .deb  (x86_64)
#   - windows-latest → .msi  (x86_64; WiX is handled by the Tauri bundler)

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: v0.21.14

permissions:
  contents: write

jobs:
  build:
    name: Bundle (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            trunk-target: aarch64-apple-darwin
          - platform: ubuntu-latest
            trunk-target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            trunk-target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install trunk (Unix)
        if: matrix.platform != 'windows-latest'
        shell: bash
        run: |
          curl -sSfL \
            "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-${{ matrix.trunk-target }}.tar.gz" \
            | tar -xzf - -C "$HOME/.cargo/bin" trunk

      - name: Install trunk (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/trunk-rs/trunk/releases/download/$env:TRUNK_VERSION/trunk-x86_64-pc-windows-msvc.zip" `
            -OutFile trunk.zip
          Expand-Archive trunk.zip -DestinationPath "$env:USERPROFILE\.cargo\bin" -Force

      - name: Build installers and attach to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Casino Blackjack ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
