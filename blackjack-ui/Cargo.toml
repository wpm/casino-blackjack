[package]
name = "blackjack-ui"
description = "Leptos frontend for Casino Blackjack"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blackjack-core = { path = "../blackjack-core" }
blackjack-protocol = { path = "../blackjack-protocol" }
leptos = { version = "0.8", features = ["csr"] }
console_error_panic_hook = "0.1"
serde = { workspace = true }
# The dev-only in-process fallback session in main.rs seeds itself from
# OS randomness (getrandom's wasm_js backend on wasm; see .cargo/config.toml).
rand = { workspace = true }
rand_chacha = { workspace = true }
# DOM types the input overlay reads beyond what leptos itself enables.
web-sys = { version = "0.3", features = ["DomRect", "Element", "EventTarget", "PointerEvent"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Backend selection for the getrandom in blackjack-core's rand dependency;
# see .cargo/config.toml at the workspace root.
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
# Motion (#10): requestAnimationFrame and the WebAudio synth.
web-sys = { version = "0.3", features = [
    "Window",
    "EventTarget",
    "AudioContext",
    "AudioContextState",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "BiquadFilterNode",
    "BiquadFilterType",
    "GainNode",
] }

[dev-dependencies]
# Seeded engine rounds for the motion property tests.
rand_chacha = { workspace = true }
