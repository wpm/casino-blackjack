[workspace]
resolver = "2"
members = ["blackjack-core", "blackjack-ui", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/wpm/casino-blackjack"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
rand_chacha = "0.9"

[profile.release]
codegen-units = 1
lto = true
